name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          echo "Key length: ${#SSH_KEY}"
          if [ -z "$SSH_KEY" ]; then
            echo "ERROR: secret DEPLOY_SSH_KEY is empty or not set"
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan 31.129.108.20 >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no root@31.129.108.20 "
            set -e
            cd /opt/masshtab-academy
            git pull origin main
            docker compose build backend frontend
            docker compose up -d --remove-orphans
            echo Done
          "
