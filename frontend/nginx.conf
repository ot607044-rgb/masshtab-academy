limit_req_zone $binary_remote_addr zone=public_calendar:10m rate=5r/s;

server {
    listen 80;
    server_name _;

    # ── React SPA ────────────────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # Все маршруты React-роутера → index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Проксирование на FastAPI ──────────────────────────────────────────────────
    location ^~ /api/v1/public-calendar/ {
        limit_req zone=public_calendar burst=20 nodelay;
        limit_req_status 429;
        client_max_body_size 32k;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /uploads/ {
        proxy_pass         http://backend:8000;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_read_timeout 120s;
    }

    # ── Кэширование статических ассетов ──────────────────────────────────────────
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Gzip ─────────────────────────────────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               text/javascript application/x-javascript text/xml
               application/xml application/rss+xml image/svg+xml;
    gzip_min_length 1024;
}
