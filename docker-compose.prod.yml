version: "3.9"

# Запуск: docker compose -f docker-compose.prod.yml --env-file .env.prod up -d

services:

  # ── База данных ───────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB:       ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Порт НЕ пробрасываем наружу — доступ только внутри docker-сети
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── FastAPI backend ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    environment:
      DATABASE_URL:               postgresql+asyncpg://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}
      SECRET_KEY:                 ${SECRET_KEY}
      ALGORITHM:                  HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 1440
      FIRST_SUPERADMIN_EMAIL:     ${SUPERADMIN_EMAIL}
      FIRST_SUPERADMIN_PASSWORD:  ${SUPERADMIN_PASSWORD}
      # Ваш домен — запросы с него будут разрешены CORS
      ALLOWED_ORIGINS:            ${ALLOWED_ORIGINS:-http://localhost}
    volumes:
      # Загружаемые файлы хранятся на хосте
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    # Порт НЕ пробрасываем наружу — nginx обращается по имени сервиса

  # ── React frontend (nginx) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    ports:
      - "80:80"    # HTTP
      # - "443:443"  # раскомментировать после настройки SSL
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
